<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Vol Drone</title>
<style>
  :root{
    --bleu:#1a3c6e;--bleu2:#2b6cb0;--bleu3:#3b82c4;--bleu-clair:#e8f0fb;
    --bord:#d9e0ea;--gris:#5a6472;--gris2:#8592a3;--texte:#1f2733;
    --vert:#2f855a;--vert-clair:#e6f4ec;--rouge:#c53030;--fond:#f4f7fb;--blanc:#fff;
    --jaune:#b7791f;--orange:#c05621;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--texte);background:var(--fond)}
  button{font-family:inherit;cursor:pointer}

  /* ---------- Verrou PIN ---------- */
  #lock{position:fixed;inset:0;background:var(--bleu);display:flex;align-items:center;justify-content:center;z-index:50}
  #lock .card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:34px 38px;width:360px;text-align:center}
  #lock .logo{width:64px;height:64px;border-radius:16px;background:var(--bleu);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  #lock h1{color:var(--bleu);font-size:20px;margin:0 0 4px}
  #lock p{color:var(--gris);font-size:13.5px;margin:4px 0 18px}
  #lock input{width:100%;padding:12px 14px;border:1px solid var(--bord);border-radius:10px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:8px}
  #lock input:focus{outline:none;border-color:var(--bleu2);box-shadow:0 0 0 3px rgba(43,108,176,.15)}
  #lock button{width:100%;margin-top:6px;padding:12px;border:none;border-radius:10px;background:var(--bleu2);color:#fff;font-size:15px;font-weight:600}
  #lock button:hover{background:var(--bleu)}
  .msg{min-height:18px;font-size:13px;margin-top:8px}
  .msg.err{color:var(--rouge)}.msg.ok{color:var(--vert)}

  /* ---------- Coque ---------- */
  #app{display:none;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh}
  #app.show{display:grid}
  .topbar{grid-column:1/3;background:var(--bleu);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .topbar .brand .ic{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px}
  .topbar .spacer{flex:1}
  .topbar .save-state{font-size:12px;color:#bcd3f0;min-width:120px;text-align:right}
  .topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:13px}
  .topbar button:hover{background:rgba(255,255,255,.22)}

  .side{background:#12315c;padding:12px 10px;overflow:auto}
  .side .grp{color:#7fa3d0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 8px 6px}
  .side a{display:flex;align-items:center;gap:9px;color:#d6e2f4;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:14px;margin-bottom:2px}
  .side a .ic{width:18px;text-align:center}
  .side a:hover{background:rgba(255,255,255,.08)}
  .side a.active{background:var(--bleu2);color:#fff;font-weight:600}
  .side a.soon{color:#6f8bb3}
  .side a .tag{margin-left:auto;font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:8px;color:#a9c1e2}

  .main{overflow:auto;padding:24px 30px}
  .page-h{margin:0 0 4px;color:var(--bleu);font-size:22px}
  .page-sub{color:var(--gris);font-size:13.5px;margin:0 0 20px}

  .card{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,40,70,.04)}
  .card > h2{margin:0 0 2px;font-size:16px;color:var(--bleu)}
  .card > .kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bleu2);margin-bottom:2px}
  .card > .desc{color:var(--gris);font-size:13px;margin:0 0 16px}
  h3.step{margin:20px 0 10px;font-size:14px;color:var(--bleu);border-top:1px solid var(--bord);padding-top:16px}
  h3.step:first-of-type{border-top:none;padding-top:0;margin-top:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/3}
  .field label{font-size:12px;color:var(--gris);font-weight:600}
  .field input,.field textarea,.field select{padding:9px 11px;border:1px solid var(--bord);border-radius:9px;font-size:14px;font-family:inherit;color:var(--texte);background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--bleu2);box-shadow:0 0 0 3px rgba(43,108,176,.12)}
  .field textarea{resize:vertical;min-height:44px}

  .btn{border:1px solid var(--bord);background:#fff;color:var(--texte);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600}
  .btn:hover{background:var(--fond)}
  .btn.primary{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .btn.primary:hover{background:var(--bleu)}
  .btn.danger{background:#fff;border-color:#f0c3c3;color:var(--rouge)}
  .btn.danger:hover{background:#fdecec}
  .btn.sm{padding:5px 9px;font-size:12.5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  .pilote{border:1px solid var(--bord);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .pilote .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .pilote .head h3{margin:0;font-size:15px;color:var(--bleu)}
  .refbox{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gris);border:1px solid var(--bord);border-radius:20px;padding:4px 11px}
  .refbox.sel{background:var(--vert-clair);border-color:#bfe3cd;color:var(--vert);font-weight:600}
  .note{background:#f0f5fc;border:1px solid #dce7f5;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--gris);margin-bottom:12px}
  .warn{background:#fff7ec;border:1px solid #f3e0c0;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--jaune);margin-bottom:12px}
  .soon-page{background:#fff;border:1px dashed var(--bord);border-radius:14px;padding:40px;text-align:center;color:var(--gris)}
  .soon-page .big{font-size:40px;margin-bottom:8px}
  .linklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .linklist a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);border:1px solid var(--bord);border-radius:10px;padding:11px 13px;font-size:13.5px;cursor:pointer}
  .linklist a:hover{border-color:var(--bleu2);background:#f7faff}
  .linklist a .ic{font-size:17px}
  .linklist a small{display:block;color:var(--gris);font-size:11.5px}

  /* ---------- SORA ---------- */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .steps button{border:1px solid var(--bord);background:#fff;color:var(--gris);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600}
  .steps button.on{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .sumbox{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;text-align:center}
  .sumbox .v{font-size:26px;font-weight:800;color:var(--bleu);line-height:1.1}
  .sumbox .v.empty{color:#c3ccd8}
  .sumbox .l{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;font-weight:700}
  .result{display:flex;align-items:center;gap:18px;background:var(--bleu-clair);border:1px solid #cfe0f6;border-radius:12px;padding:16px 18px;margin:12px 0}
  .result .big{font-size:34px;font-weight:800;color:var(--bleu);line-height:1}
  .result .lbl{font-size:12px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kv{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:2px 0}
  .kv span{color:var(--gris)}
  .ynrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--bord);border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:13.5px}
  .ynrow .q{flex:1}
  .ynbtns{display:flex;gap:6px}
  .ynbtns button{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--gris)}
  .ynbtns button.on-y{background:var(--vert);border-color:var(--vert);color:#fff}
  .ynbtns button.on-n{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  table.sora{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
  table.sora th,table.sora td{border:1px solid var(--bord);padding:5px 7px;text-align:center}
  table.sora th{background:#eef4fb;color:var(--bleu);font-weight:700}
  table.sora td.rowlbl,table.sora th.rowlbl{text-align:left;font-weight:600;color:var(--texte);background:#fafcff}
  table.sora td.hi{background:var(--bleu2)!important;color:#fff;font-weight:800}
  .osoitem{display:flex;align-items:center;gap:12px;border:1px solid var(--bord);border-radius:10px;padding:9px 13px;margin-bottom:7px}
  .osoitem .id{font-weight:800;color:var(--bleu);min-width:42px;font-size:13px}
  .osoitem .t{flex:1;font-size:13px}
  .osoitem .cat{font-size:11px;color:var(--gris2);min-width:74px}
  .badge{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px;min-width:88px;text-align:center}
  .b-yellow{background:#fdf3d7;color:var(--jaune)}
  .b-orange{background:#fbe5d6;color:var(--orange)}
  .b-red{background:#fcdada;color:var(--rouge)}
  .b-grey{background:#eef1f5;color:var(--gris2)}
  .b-cert{background:var(--rouge);color:#fff;padding:3px 10px;border-radius:7px;font-weight:800;font-size:12px}

  @media(max-width:900px){.grid,.linklist{grid-template-columns:1fr}.field.full{grid-column:1}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ VERROU PIN ============ -->
<div id="lock">
  <div class="card">
    <div class="logo">🛩</div>
    <h1 id="lockTitle">Assistant Vol Drone</h1>
    <p id="lockText">Chargement…</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Confirmer" style="display:none">
    <button id="btnPin">Valider</button>
    <div id="pinMsg" class="msg"></div>
  </div>
</div>

<!-- ============ APPLICATION ============ -->
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="ic">🛩</span> Assistant Vol Drone</div>
    <div class="spacer"></div>
    <div class="save-state" id="saveState"></div>
    <button id="btnLock">🔒 Verrouiller</button>
  </div>
  <nav class="side" id="side"></nav>
  <main class="main" id="view"></main>
</div>

<script>
"use strict";
const invoke = window.__TAURI__.core.invoke;

function openExternal(url){
  try{
    if(window.__TAURI__.opener && window.__TAURI__.opener.openUrl){ window.__TAURI__.opener.openUrl(url); return; }
  }catch(e){}
  invoke('plugin:opener|open_url',{url:url}).catch(()=>{});
}

/* =========================================================
   RÉFÉRENCES SORA 2.5
   ========================================================= */
const IGRC = {
  cols:[{dim:1,spd:25},{dim:3,spd:35},{dim:8,spd:75},{dim:20,spd:120},{dim:40,spd:200}],
  crit:[6.5,65,650,6500,65000],
  rows:[
    {key:'ctrl',  label:'Zone contrôlée au sol (tiers exclus)',           vals:[1,1,2,3,3]},
    {key:'d5',    label:'< 5 hab/km² — isolé / rural',                    vals:[2,3,4,5,6]},
    {key:'d50',   label:'< 50 hab/km² — faible peuplement',               vals:[3,4,5,6,7]},
    {key:'d500',  label:'< 500 hab/km² — résidentiel peu dense',          vals:[4,5,6,7,8]},
    {key:'d5000', label:'< 5 000 hab/km² — péri-urbain',                  vals:[5,6,7,8,9]},
    {key:'d50000',label:'< 50 000 hab/km² — urbain dense',                vals:[6,7,8,9,10]},
    {key:'dsup',  label:'> 50 000 hab/km² — rassemblement de personnes',  vals:[7,8,null,null,null]}
  ]
};
const MIT = {
  m1a:{label:'M1(A) — Stratégique · Facteur de refuge (sheltering)', opts:[['none','Absent / Faible',0],['low','Faible',-1],['med','Moyenne',-2]]},
  m1b:{label:'M1(B) — Stratégique · Restrictions opérationnelles',   opts:[['none','Absent',0],['med','Moyenne',-1],['high','Haute',-2]]},
  m1c:{label:'M1(C) — Tactique · Observation au sol (VLOS)',         opts:[['none','Absent',0],['low','Faible',-1]]},
  m2: {label:'M2 — Réduction des effets de l\'impact au sol',        opts:[['none','Absent / Faible',0],['med','Moyenne',-1],['high','Haute',-2]]}
};
const SAILT = {2:['I','II','IV','VI'],3:['II','II','IV','VI'],4:['III','III','IV','VI'],
  5:['IV','IV','IV','VI'],6:['V','V','V','VI'],7:['VI','VI','VI','VI']};
const TAC={a:{n:'Aucun minimum',r:'Aucune'},b:{n:'Faible',r:'Faible'},c:{n:'Moyen',r:'Moyenne'},d:{n:'Haut',r:'Haute'}};
const OSO=[
  {id:'01',cat:'Technique',t:'Opérateur UAS compétent et/ou approuvé',        r:['-','L','M','H','H','H']},
  {id:'02',cat:'Technique',t:'Constructeur UAS compétent et/ou approuvé',     r:['-','-','L','M','H','H']},
  {id:'03',cat:'Technique',t:'Maintenance de l\'UAS',                          r:['L','L','M','M','H','H']},
  {id:'04',cat:'Technique',t:'Composants essentiels selon standards de navigabilité',r:['-','-','-','M','H','H']},
  {id:'05',cat:'Technique',t:'UAS conçu selon standards fiabilité/sécurité',  r:['-','-','L','M','H','H']},
  {id:'06',cat:'Technique',t:'Performances du lien C3 appropriées',           r:['-','L','L','M','H','H']},
  {id:'07',cat:'Technique',t:'Vérification de conformité de la configuration UAS',r:['L','L','M','M','H','H']},
  {id:'08',cat:'Procédures',t:'Procédures opérationnelles définies et validées',r:['L','M','H','H','H','H']},
  {id:'09',cat:'Équipage',t:'Équipage formé et entraîné régulièrement',        r:['L','L','M','M','H','H']},
  {id:'13',cat:'Procédures',t:'Systèmes externes de soutien adéquats',        r:['L','L','M','H','H','H']},
  {id:'16',cat:'Équipage',t:'Coordination intra-équipage',                     r:['L','L','M','M','H','H']},
  {id:'17',cat:'Équipage',t:'Équipage en capacité d\'exploiter l\'UAS',        r:['L','L','M','M','H','H']},
  {id:'18',cat:'Technique',t:'Protection auto. de l\'enveloppe de vol',        r:['-','-','L','M','H','H']},
  {id:'19',cat:'Procédures',t:'Retour à la normale après une erreur humaine',  r:['-','-','L','M','M','H']},
  {id:'20',cat:'Équipage',t:'Facteurs humains évalués, IHM adaptée',           r:['-','L','L','M','M','H']},
  {id:'23',cat:'Procédures',t:'Conditions environnementales définies et surveillées',r:['L','L','M','M','H','H']},
  {id:'24',cat:'Technique',t:'UAS conçu/adapté aux conditions défavorables',   r:['-','-','M','H','H','H']}
];
const REQMAP={'L':'b-yellow','M':'b-orange','H':'b-red','-':'b-grey'};
const REQTXT={'L':'Faible (L)','M':'Moyen (M)','H':'Haut (H)','-':'Non requis'};

/* =========================================================
   DONNÉES
   ========================================================= */
function emptyExploitant(){return {raison:'',forme:'',siret:'',numUAS:'',responsable:'',adresse:'',cp:'',ville:'',tel:'',mail:'',assureur:'',police:'',notes:''};}
function emptySora(){return {
  titre:'',
  grc:{dim:'',vit:'',densite:'',mini:false,m1a:'none',m1b:'none',m1c:'none',m2:'none'},
  arc:{atypical:'',fl600:'',airport:'',airportClass:'',above500:'',adsb:'',eac:'',urban:'',residual:'',reduceJust:'',tacJust:''}
};}
function emptyStore(){return {exploitant:emptyExploitant(),pilotes:[],referent:'',sora:emptySora()};}
function seededStore(){
  const s=emptyStore();
  s.exploitant={
    raison:'M.G.I. — Maintenance Générale Industrielle',forme:'EURL',
    siret:'98151498700024',numUAS:'UAS-FR-368093',
    responsable:'Paul JEANNIN-GIRARDON',adresse:'12 Le Pinier',
    cp:'85250',ville:'Vendrennes',tel:'0788372276',mail:'contact@mgi-vendee.fr',
    assureur:'',police:'',notes:'TVA FR72981514987 · APE 33.12Z · SIREN 981514987'
  };
  return s;
}
function normalize(raw){
  const s=Object.assign(emptyStore(),raw||{});
  s.exploitant=Object.assign(emptyExploitant(),raw&&raw.exploitant||{});
  if(!Array.isArray(s.pilotes))s.pilotes=[];
  s.pilotes=s.pilotes.map(p=>Object.assign(
    {id:'p'+Math.random().toString(36).slice(2),prenom:'',nom:'',tel:'',mail:'',numTele:'',brevets:'',mentions:'',habilitations:'',notes:''},p));
  if(s.referent && !s.pilotes.some(p=>p.id===s.referent))s.referent=s.pilotes[0]?s.pilotes[0].id:'';
  const so=emptySora();
  s.sora=Object.assign(so,raw&&raw.sora||{});
  s.sora.grc=Object.assign(so.grc,raw&&raw.sora&&raw.sora.grc||{});
  s.sora.arc=Object.assign(so.arc,raw&&raw.sora&&raw.sora.arc||{});
  return s;
}

let store=emptyStore();
let saveTimer=null;

async function loadStore(){
  let raw={};
  try{ raw=JSON.parse(await invoke('data_get')||'{}'); }catch(e){ raw={}; }
  const empty=!raw || (!raw.exploitant && (!raw.pilotes||!raw.pilotes.length));
  store = empty ? seededStore() : normalize(raw);
  if(empty){ await persist(true); }
}
async function persist(silent){
  try{
    await invoke('data_set',{json:JSON.stringify(store)});
    if(!silent) setSaved('Enregistré ✓');
  }catch(e){ setSaved('Erreur d\'enregistrement',true); }
}
function scheduleSave(){
  setSaved('Modification…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>persist(false),450);
}
function setSaved(t,err){
  const el=document.getElementById('saveState');
  el.textContent=t; el.style.color=err?'#f6b0b0':'#bcd3f0';
}

/* =========================================================
   MOTEUR DE CALCUL SORA
   ========================================================= */
function colIndex(dim,vit){
  let ci=0,cv=0;
  for(let i=0;i<IGRC.cols.length;i++){ if(dim<=IGRC.cols[i].dim){ci=i;break;} if(i===IGRC.cols.length-1)ci=i; }
  for(let i=0;i<IGRC.cols.length;i++){ if(vit<=IGRC.cols[i].spd){cv=i;break;} if(i===IGRC.cols.length-1)cv=i; }
  return Math.max(ci,cv);
}
function mitVal(m,key){const o=m.opts.find(x=>x[0]===key);return o?o[2]:0;}
function computeARC(a){
  if(a.atypical==='yes') return 'a';
  if(a.fl600==='yes') return 'b';
  if(a.airport==='yes') return a.airportClass==='yes'?'d':'c';
  if(a.above500==='yes'){ if(a.adsb==='yes'||a.eac==='yes') return 'd'; return 'c'; }
  if(a.adsb==='yes'||a.eac==='yes'||a.urban==='yes') return 'c';
  return 'b';
}
function computeSora(){
  const g=store.sora.grc, a=store.sora.arc;
  const dim=parseFloat(g.dim), vit=parseFloat(g.vit);
  const out={valid:false};
  if(!isNaN(dim)&&!isNaN(vit)&&g.densite){
    const ci=colIndex(dim,vit), ri=IGRC.rows.findIndex(r=>r.key===g.densite);
    let igrc=IGRC.rows[ri].vals[ci];
    const mini = g.mini && g.densite!=='dsup';
    if(mini) igrc=1;
    out.ci=ci; out.igrc=igrc; out.crit=IGRC.crit[ci];
    let red=mitVal(MIT.m1a,g.m1a)+mitVal(MIT.m1b,g.m1b)+mitVal(MIT.m1c,g.m1c)+mitVal(MIT.m2,g.m2);
    const floor=IGRC.rows[0].vals[ci];
    out.reduction=red; out.floor=floor;
    out.grc = igrc!=null ? Math.max(igrc+red,floor) : null;
    out.cumulConflict = (g.m1a==='med' && g.m1b!=='none');
    out.valid = igrc!=null;
  }
  out.arcInitial=computeARC(a);
  out.arcResidual=a.residual||out.arcInitial;
  if(out.grc!=null && out.arcResidual){
    if(out.grc>7) out.sail='CERT';
    else{ const gc=Math.max(2,Math.min(7,out.grc)); const ai={a:0,b:1,c:2,d:3}[out.arcResidual]; out.sail=SAILT[gc][ai]; }
  }
  if(out.sail && out.sail!=='CERT'){
    const si=['I','II','III','IV','V','VI'].indexOf(out.sail);
    out.sailIdx=si;
    out.osoReq=OSO.map(o=>({id:o.id,cat:o.cat,t:o.t,lvl:o.r[si]}));
  }
  return out;
}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function card(kick,title,desc){
  const c=el('div','card');
  if(kick)c.appendChild(el('div','kick',kick));
  c.appendChild(el('h2',null,title));
  if(desc)c.appendChild(el('div','desc',desc));
  return c;
}
function field(label,obj,key,opts){
  opts=opts||{};
  const f=el('div','field'+(opts.full?' full':''));
  f.appendChild(el('label',null,label));
  let inp;
  if(opts.type==='textarea'){inp=document.createElement('textarea');if(opts.rows)inp.rows=opts.rows;}
  else if(opts.type==='select'){
    inp=document.createElement('select');
    (opts.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];inp.appendChild(op);});
  }
  else inp=document.createElement('input');
  inp.value=obj[key]!=null?obj[key]:'';
  inp.onchange=inp.oninput=()=>{obj[key]=inp.value;scheduleSave();if(opts.after)opts.after();};
  f.appendChild(inp);
  return f;
}

function soraGRC(v,R){
  const g=store.sora.grc;
  const c=card('Étapes 1 · 2 · 3','Risque au sol — GRC','Dimension/vitesse et densité de population donnent l\'iGRC, puis les atténuations M1/M2 donnent le GRC final.');

  g1.append(
    field('Dimension caractéristique (m)',g,'dim',{after:()=>renderView()}),
    field('Vitesse max opérationnelle (m/s)',g,'vit',{after:()=>renderView()}),
  );
  c.appendChild(g1);
  c.appendChild(selRow('Densité de population survolée',g,'densite',
    [['','— choisir —'],...IGRC.rows.map(r=>[r.key,r.label])]));

  const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!g.mini;
  cb.onchange=()=>{g.mini=cb.checked;scheduleSave();renderView();};
  const ml=el('div','q','Drone < 250 g ET vitesse ≤ 25 m/s (iGRC = 1, sauf rassemblement — Note 1)');

  if(R.valid){
    const res=el('div','result');
    const b=el('div');b.innerHTML='<div class="big">'+R.igrc+'</div><div class="lbl">iGRC initial</div>';
    const d=el('div');d.style.borderLeft='1px solid #cfe0f6';d.style.paddingLeft='14px';d.style.flex='1';
    d.innerHTML='<div class="kv"><span>Colonne retenue</span><b>'+IGRC.cols[R.ci].dim+' m / '+IGRC.cols[R.ci].spd+' m/s</b></div>'+
                '<div class="kv"><span>Aire critique</span><b>'+R.crit+' m²</b></div>';
    res.append(b,d);c.appendChild(res);
    c.appendChild(igrcTable(R));
  } else {
    c.appendChild(el('div','note','Renseignez dimension, vitesse et densité pour calculer l\'iGRC.'));
  }

  c.appendChild(el('h3','step','Étape 3 — Atténuations et GRC final'));

  g2.append(
    selRow(MIT.m1a.label,g,'m1a',MIT.m1a.opts.map(o=>[o[0],o[1]])),
    selRow(MIT.m1b.label,g,'m1b',MIT.m1b.opts.map(o=>[o[0],o[1]])),
    selRow(MIT.m1c.label,g,'m1c',MIT.m1c.opts.map(o=>[o[0],o[1]])),
    selRow(MIT.m2.label,g,'m2',MIT.m2.opts.map(o=>[o[0],o[1]])),
  );
  c.appendChild(g2);
  if(R.cumulConflict) c.appendChild(el('div','warn','Attention : M1(A) Moyenne et M1(B) ne se cumulent pas librement dans SORA 2.5. Vérifiez la justification du cumul.'));
  if(R.valid){
    const res=el('div','result');
    const b=el('div');b.innerHTML='<div class="big">'+R.grc+'</div><div class="lbl">GRC final</div>';
    const d=el('div');d.style.borderLeft='1px solid #cfe0f6';d.style.paddingLeft='14px';d.style.flex='1';
    d.innerHTML='<div class="kv"><span>iGRC</span><b>'+R.igrc+'</b></div>'+
                '<div class="kv"><span>Réduction atténuations</span><b>'+R.reduction+'</b></div>'+
                '<div class="kv"><span>Plancher (zone contrôlée)</span><b>'+R.floor+'</b></div>';
    res.append(b,d);c.appendChild(res);
  }
  v.appendChild(c);
}
function igrcTable(R){
  const wrap=el('div');
  const t=document.createElement('table');t.className='sora';
  let head='<tr><th class="rowlbl">Densité \\ colonne</th>';
  IGRC.cols.forEach((c,i)=>head+='<th class="'+(R.ci===i?'hi':'')+'">'+c.dim+' m<br>'+c.spd+' m/s</th>');
  head+='</tr>';
  let body='';
  IGRC.rows.forEach(r=>{
    body+='<tr><td class="rowlbl">'+r.label+'</td>';
    r.vals.forEach((val,i)=>{
      const hi=(IGRC.rows.findIndex(x=>x.key===store.sora.grc.densite)===IGRC.rows.indexOf(r) && R.ci===i);
      body+='<td class="'+(hi?'hi':'')+'">'+(val==null?'—':val)+'</td>';
    });
    body+='</tr>';
  });
  t.innerHTML=head+body;
  wrap.appendChild(t);
  const cap=el('div','desc','Tableau iGRC — SORA 2.5. La colonne la plus conservatrice (dimension OU vitesse) est retenue.');
  cap.style.marginTop='4px';wrap.appendChild(cap);
  return wrap;
}

function soraARC(v,R){
  const a=store.sora.arc;
  const c=card('Étapes 4 · 5 · 6','Risque air — ARC','Arbre de décision de l\'ARC initial, réduction éventuelle, puis exigence d\'atténuation tactique.');

  c.appendChild(el('h3','step','Étape 4 — ARC initial'));
  c.appendChild(ynRow('Espace aérien atypique (ZRT/ZIT, ségrégation, ≤ 30 m sol hors zones d\'aérodrome…) ?',a,'atypical'));
  if(a.atypical!=='yes'){
    c.appendChild(ynRow('Opération au-dessus du FL600 ?',a,'fl600'));
    if(a.fl600!=='yes'){
      c.appendChild(ynRow('Zone aéroportuaire (proximité aérodrome / hélistation) ?',a,'airport'));
      if(a.airport==='yes'){
        c.appendChild(ynRow('… au sein d\'un espace aérien de classe A, B, C ou D ?',a,'airportClass'));
      } else {
        c.appendChild(ynRow('Hauteur > 500 ft AGL (≈ 152 m) ?',a,'above500'));
        c.appendChild(ynRow('Zone ADS-B ou TMZ ?',a,'adsb'));
        c.appendChild(ynRow('Au sein d\'un espace aérien contrôlé (EAC) ?',a,'eac'));
        if(a.above500!=='yes'&&a.adsb!=='yes'&&a.eac!=='yes')
          c.appendChild(ynRow('Au-dessus d\'une zone urbaine ?',a,'urban'));
      }
    }
  }
  const res=el('div','result');
  res.innerHTML='<div><div class="big">ARC-'+R.arcInitial+'</div><div class="lbl">ARC initial</div></div>';
  c.appendChild(res);

  c.appendChild(el('h3','step','Étape 5 — ARC final (résiduel)'));
  c.appendChild(el('div','note','L\'ARC peut être réduit avec justification (densité aérienne, coordination/accord ANSP, information des usagers…). En VLOS/EVLOS : au plus 1 cran, sans jamais atteindre ARC-a.'));
  const opts=[['','— (= ARC initial : ARC-'+R.arcInitial+')'],['b','ARC-b'],['c','ARC-c'],['d','ARC-d']];
  if(R.arcInitial==='a')opts.push(['a','ARC-a']);
  const gsel=el('div','grid');
  gsel.appendChild(field('ARC final retenu',a,'residual',{type:'select',options:opts,after:()=>renderView()}));
  c.appendChild(gsel);
  if(a.residual && a.residual!==R.arcInitial)
    c.appendChild(field('Justification de la réduction ARC',a,'reduceJust',{type:'textarea',rows:3,full:true}));

  c.appendChild(el('h3','step','Étape 6 — Atténuation tactique du risque air'));
  const tac=TAC[R.arcResidual];
  const rt=el('div','result');
  const b=el('div');b.innerHTML='<div class="big">ARC-'+R.arcResidual+'</div><div class="lbl">ARC final</div>';
  const d=el('div');d.style.borderLeft='1px solid #cfe0f6';d.style.paddingLeft='14px';d.style.flex='1';
  d.innerHTML='<div class="kv"><span>Niveau d\'atténuation tactique</span><b>'+tac.n+'</b></div>'+
              '<div class="kv"><span>Robustesse requise</span><b>'+tac.r+'</b></div>';
  rt.append(b,d);c.appendChild(rt);
  c.appendChild(field('Moyens tactiques & justification (observateurs, ADS-B/FLARM, coordination PSNA, portée, % détection…)',a,'tacJust',{type:'textarea',rows:3,full:true}));
  v.appendChild(c);
}

function soraSAIL(v,R){
  const c=card('Étapes 7 à 10','SAIL & objectifs de sécurité (OSO)','Le SAIL résulte du croisement GRC final × ARC final. Il fixe le niveau de robustesse de chaque OSO.');

function sailTable(R){
  const wrap=el('div');
  const t=document.createElement('table');t.className='sora';
  let h='<tr><th class="rowlbl">GRC \\ ARC</th><th>ARC-a</th><th>ARC-b</th><th>ARC-c</th><th>ARC-d</th></tr>';
  const gc=Math.max(2,Math.min(7,R.grc)); const ai={a:0,b:1,c:2,d:3}[R.arcResidual];
  Object.keys(SAILT).forEach(gv=>{
    h+='<tr><td class="rowlbl">GRC '+gv+'</td>';

  });
  t.innerHTML=h;wrap.appendChild(t);
  const cap=el('div','desc','Matrice SAIL — SORA 2.5. GRC > 7 : catégorie certifiée.');

}

  const code=pin.value.trim();
  if(pinMode==='create'){
    if(code.length<4){setPinMsg('Au moins 4 chiffres.','err');return;}
    if(code!==pin2.value.trim()){setPinMsg('Les deux codes ne correspondent pas.','err');return;}
    try{await invoke('set_pin',{pin:code});setPinMsg('',''); enterApp();}
    catch(e){setPinMsg(String(e),'err');}
  }else{
    const okv=await invoke('verify_pin',{pin:code});
    if(okv){setPinMsg('','');enterApp();}
    else{setPinMsg('Code incorrect.','err');pin.value='';pin.focus();}
  }
}
async function enterApp(){
  lock.style.display='none';appEl.classList.add('show');
  await loadStore();
  renderNav();renderView();
  setSaved('');
}
btnPin.addEventListener('click',submitPin);
pin.addEventListener('keydown',e=>{if(e.key==='Enter'){pinMode==='create'?pin2.focus():submitPin();}});
pin2.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin();});
document.getElementById('btnLock').addEventListener('click',()=>{appEl.classList.remove('show');lock.style.display='flex';bootLock();});

bootLock();
</script>
</body>
</html>
