<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Vol Drone</title>
<style>
  :root{
    --bleu:#1a3c6e;--bleu2:#2b6cb0;--bleu3:#3b82c4;--bleu-clair:#e8f0fb;
    --bord:#d9e0ea;--gris:#5a6472;--gris2:#8592a3;--texte:#1f2733;
    --vert:#2f855a;--vert-clair:#e6f4ec;--rouge:#c53030;--fond:#f4f7fb;--blanc:#fff;
    --jaune:#b7791f;--orange:#c05621;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--texte);background:var(--fond)}
  button{font-family:inherit;cursor:pointer}

  /* Verrou PIN */
  #lock{position:fixed;inset:0;background:var(--bleu);display:flex;align-items:center;justify-content:center;z-index:50}
  #lock .card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:34px 38px;width:360px;text-align:center}
  #lock .logo{width:64px;height:64px;border-radius:16px;background:var(--bleu);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  #lock h1{color:var(--bleu);font-size:20px;margin:0 0 4px}
  #lock p{color:var(--gris);font-size:13.5px;margin:4px 0 18px}
  #lock input{width:100%;padding:12px 14px;border:1px solid var(--bord);border-radius:10px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:8px}
  #lock input:focus{outline:none;border-color:var(--bleu2);box-shadow:0 0 0 3px rgba(43,108,176,.15)}
  #lock button{width:100%;margin-top:6px;padding:12px;border:none;border-radius:10px;background:var(--bleu2);color:#fff;font-size:15px;font-weight:600}
  #lock button:hover{background:var(--bleu)}
  .msg{min-height:18px;font-size:13px;margin-top:8px}
  .msg.err{color:var(--rouge)}.msg.ok{color:var(--vert)}

  /* Coque */
  #app{display:none;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh}
  #app.show{display:grid}
  .topbar{grid-column:1/3;background:var(--bleu);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .topbar .brand .ic{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px}
  .topbar .spacer{flex:1}
  .topbar .save-state{font-size:12px;color:#bcd3f0;min-width:120px;text-align:right}
  .topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:13px}
  .topbar button:hover{background:rgba(255,255,255,.22)}

  .side{background:#12315c;padding:12px 10px;overflow:auto}
  .side .grp{color:#7fa3d0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 8px 6px}
  .side a{display:flex;align-items:center;gap:9px;color:#d6e2f4;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:14px;margin-bottom:2px;cursor:pointer}
  .side a .ic{width:18px;text-align:center}
  .side a:hover{background:rgba(255,255,255,.08)}
  .side a.active{background:var(--bleu2);color:#fff;font-weight:600}
  .side a.soon{color:#6f8bb3}
  .side a .tag{margin-left:auto;font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:8px;color:#a9c1e2}

  .main{overflow:auto;padding:24px 30px}
  .page-h{margin:0 0 4px;color:var(--bleu);font-size:22px}
  .page-sub{color:var(--gris);font-size:13.5px;margin:0 0 20px}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--bleu2);font-size:13px;font-weight:600;background:none;border:none;padding:0;margin-bottom:10px}

  .card{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,40,70,.04)}
  .card > h2{margin:0 0 2px;font-size:16px;color:var(--bleu)}
  .card > .kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bleu2);margin-bottom:2px}
  .card > .desc{color:var(--gris);font-size:13px;margin:0 0 16px}
  h3.step{margin:20px 0 10px;font-size:14px;color:var(--bleu);border-top:1px solid var(--bord);padding-top:16px}
  h3.step:first-of-type{border-top:none;padding-top:0;margin-top:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--gris);font-weight:600}
  .field input,.field textarea,.field select{padding:9px 11px;border:1px solid var(--bord);border-radius:9px;font-size:14px;font-family:inherit;color:var(--texte);background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--bleu2);box-shadow:0 0 0 3px rgba(43,108,176,.12)}
  .field textarea{resize:vertical;min-height:44px}
  .field input:read-only{background:#f4f7fb;color:var(--gris)}

  .btn{border:1px solid var(--bord);background:#fff;color:var(--texte);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600}
  .btn:hover{background:var(--fond)}
  .btn.primary{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .btn.primary:hover{background:var(--bleu)}
  .btn.danger{background:#fff;border-color:#f0c3c3;color:var(--rouge)}
  .btn.danger:hover{background:#fdecec}
  .btn.sm{padding:5px 9px;font-size:12.5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  .pilote{border:1px solid var(--bord);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .pilote .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .pilote .head h3{margin:0;font-size:15px;color:var(--bleu)}
  .refbox{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gris);border:1px solid var(--bord);border-radius:20px;padding:4px 11px}
  .refbox.sel{background:var(--vert-clair);border-color:#bfe3cd;color:var(--vert);font-weight:600}
  .note{background:#f0f5fc;border:1px solid #dce7f5;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--gris);margin-bottom:12px}
  .warn{background:#fff7ec;border:1px solid #f3e0c0;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--jaune);margin-bottom:12px}
  .soon-page{background:#fff;border:1px dashed var(--bord);border-radius:14px;padding:40px;text-align:center;color:var(--gris)}
  .soon-page .big{font-size:40px;margin-bottom:8px}
  .linklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .linklist a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);border:1px solid var(--bord);border-radius:10px;padding:11px 13px;font-size:13.5px;cursor:pointer}
  .linklist a:hover{border-color:var(--bleu2);background:#f7faff}
  .linklist a .ic{font-size:17px}
  .linklist a small{display:block;color:var(--gris);font-size:11.5px}

  /* Dossiers */
  .doscard{display:flex;align-items:center;gap:14px;border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;cursor:pointer}
  .doscard:hover{border-color:var(--bleu2);background:#f7faff}
  .doscard .ic{width:40px;height:40px;border-radius:10px;background:var(--bleu-clair);color:var(--bleu);display:flex;align-items:center;justify-content:center;font-size:19px}
  .doscard .info{flex:1}
  .doscard .info b{font-size:14.5px;color:var(--texte)}
  .doscard .info small{display:block;color:var(--gris);font-size:12px;margin-top:2px}
  .doscard .sail{font-size:12px;font-weight:800;color:#fff;background:var(--bleu2);border-radius:8px;padding:4px 10px}
  .doscard .sail.empty{background:#c3ccd8}
  .doscard .acts{display:flex;gap:6px}
  .doscard .acts button{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:5px 8px;font-size:13px}
  .doscard .acts button:hover{background:var(--fond)}

  /* SORA */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .steps button{border:1px solid var(--bord);background:#fff;color:var(--gris);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600}
  .steps button.on{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .sumbox{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;text-align:center}
  .sumbox .v{font-size:26px;font-weight:800;color:var(--bleu);line-height:1.1}
  .sumbox .v.empty{color:#c3ccd8}
  .sumbox .l{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;font-weight:700}
  .result{display:flex;align-items:center;gap:18px;background:var(--bleu-clair);border:1px solid #cfe0f6;border-radius:12px;padding:16px 18px;margin:12px 0}
  .result .big{font-size:34px;font-weight:800;color:var(--bleu);line-height:1}
  .result .lbl{font-size:12px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kv{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:2px 0}
  .kv span{color:var(--gris)}
  .ynrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--bord);border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:13.5px}
  .ynrow .q{flex:1}
  .ynbtns{display:flex;gap:6px}
  .ynbtns button{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--gris)}
  .ynbtns button.on-y{background:var(--vert);border-color:var(--vert);color:#fff}
  .ynbtns button.on-n{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  table.sora{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
  table.sora th,table.sora td{border:1px solid var(--bord);padding:5px 7px;text-align:center}
  table.sora th{background:#eef4fb;color:var(--bleu);font-weight:700}
  table.sora td.rowlbl,table.sora th.rowlbl{text-align:left;font-weight:600;color:var(--texte);background:#fafcff}
  table.sora td.hi{background:var(--bleu2)!important;color:#fff;font-weight:800}
  .osoitem{display:flex;align-items:center;gap:12px;border:1px solid var(--bord);border-radius:10px;padding:9px 13px;margin-bottom:7px}
  .osoitem .id{font-weight:800;color:var(--bleu);min-width:42px;font-size:13px}
  .osoitem .t{flex:1;font-size:13px}
  .badge{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px;min-width:88px;text-align:center}
  .b-yellow{background:#fdf3d7;color:var(--jaune)}
  .b-orange{background:#fbe5d6;color:var(--orange)}
  .b-red{background:#fcdada;color:var(--rouge)}
  .b-grey{background:#eef1f5;color:var(--gris2)}
  .b-green{background:var(--vert-clair);color:var(--vert)}
  .fieldlabel{font-size:12px;color:var(--gris);font-weight:700;margin:14px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .chip{border:1px solid var(--bord);background:#fff;color:var(--gris);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600}
  .chip:hover{border-color:var(--bleu2)}
  .chip.on{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
  .habrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .habrow input[type=text],.habrow input:not([type]){flex:1}
  .habrow input{padding:8px 11px;border:1px solid var(--bord);border-radius:9px;font-size:13.5px;font-family:inherit}
  .habrow input[type=date]{flex:0 0 150px}
  .habrow .badge{flex:0 0 auto;min-width:96px}
  .appinfo{display:flex;flex-wrap:wrap;gap:8px 18px;background:#f7faff;border:1px solid #e0eaf7;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px}
  .appinfo .it b{color:var(--bleu)}

  @media(max-width:900px){.grid,.grid3,.linklist{grid-template-columns:1fr}.field.full{grid-column:1}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="lock">
  <div class="card">
    <div class="logo">🛩</div>
    <h1 id="lockTitle">Assistant Vol Drone</h1>
    <p id="lockText">Chargement…</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Confirmer" style="display:none">
    <button id="btnPin">Valider</button>
    <div id="pinMsg" class="msg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="ic">🛩</span> Assistant Vol Drone</div>
    <div class="spacer"></div>
    <div class="save-state" id="saveState"></div>
    <button id="btnLock">🔒 Verrouiller</button>
  </div>
  <nav class="side" id="side"></nav>
  <main class="main" id="view"></main>
</div>

<script src="vendor/pdf-lib.min.js"></script>

/* Statut d'une date de validité d'habilitation */
function habStatus(d){
  if(!d) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return null;
  const days=Math.round((dt-today)/86400000);
  if(days<0) return {cls:'b-red',txt:'Périmé'};
  if(days<=60) return {cls:'b-orange',txt:'À renouveler ('+days+' j)'};
  return {cls:'b-green',txt:'Valide'};
}

function normDossier(d){

function normalize(raw){
  const s=Object.assign(emptyStore(),raw||{});
  s.exploitant=Object.assign(emptyExploitant(),raw&&raw.exploitant||{});
  if(!Array.isArray(s.pilotes))s.pilotes=[];
  s.pilotes=s.pilotes.map(p=>{
    const np=Object.assign(
      {id:'p'+Math.random().toString(36).slice(2),prenom:'',nom:'',tel:'',mail:'',numTele:'',brevets:'',mentions:[],habilitations:[],notes:''},p);
    // mentions : ancien texte -> tableau de codes cochés
    if(typeof np.mentions==='string'){ const s2=np.mentions; np.mentions = s2 ? MENTIONS.filter(c=>s2.indexOf(c)>=0) : []; }
    if(!Array.isArray(np.mentions)) np.mentions=[];
    // habilitations : ancien texte -> une ligne
    if(typeof np.habilitations==='string'){ np.habilitations = np.habilitations.trim() ? [{t:np.habilitations.trim(),d:''}] : []; }
    if(!Array.isArray(np.habilitations)) np.habilitations=[];
    np.habilitations=np.habilitations.map(h=>Object.assign({t:'',d:''},h));
    return np;
  });
  if(s.referent && !s.pilotes.some(p=>p.id===s.referent))s.referent=s.pilotes[0]?s.pilotes[0].id:'';
  // migration : ancien SORA unique -> premier dossier
  if(!Array.isArray(s.dossiers))s.dossiers=[];
  if((!s.dossiers.length) && raw && raw.sora){
    const d=emptyDossier(); d.titre='Dossier importé';
    d.grc=Object.assign(d.grc,raw.sora.grc||{}); d.arc=Object.assign(d.arc,raw.sora.arc||{});
    s.dossiers=[d];
  }
  s.dossiers=s.dossiers.map(normDossier);
  if(s.currentId && !s.dossiers.some(d=>d.id===s.currentId))s.currentId='';
  return s;
}

/* ========== MOTEUR SORA ========== */
function colIndex(dim,vit){
  let ci=0,cv=0;
  for(let i=0;i<IGRC.cols.length;i++){ if(dim<=IGRC.cols[i].dim){ci=i;break;} if(i===IGRC.cols.length-1)ci=i; }
  for(let i=0;i<IGRC.cols.length;i++){ if(vit<=IGRC.cols[i].spd){cv=i;break;} if(i===IGRC.cols.length-1)cv=i; }
  return Math.max(ci,cv);
}
function mitVal(m,key){const o=m.opts.find(x=>x[0]===key);return o?o[2]:0;}
function computeARC(a){
  if(a.atypical==='yes') return 'a';
  if(a.fl600==='yes') return 'b';
  if(a.airport==='yes') return a.airportClass==='yes'?'d':'c';
  if(a.above500==='yes'){ if(a.adsb==='yes'||a.eac==='yes') return 'd'; return 'c'; }
  if(a.adsb==='yes'||a.eac==='yes'||a.urban==='yes') return 'c';
  return 'b';
}
function computeSora(D){
  const g=D.grc, a=D.arc;
  const dim=parseFloat(g.dim), vit=parseFloat(g.vit);
  const out={valid:false};
  if(!isNaN(dim)&&!isNaN(vit)&&g.densite){
    const ci=colIndex(dim,vit), ri=IGRC.rows.findIndex(r=>r.key===g.densite);
    let igrc=IGRC.rows[ri].vals[ci];
    const mini = g.mini && g.densite!=='dsup';
    if(mini) igrc=1;
    out.ci=ci; out.igrc=igrc; out.crit=IGRC.crit[ci];
    let red=mitVal(MIT.m1a,g.m1a)+mitVal(MIT.m1b,g.m1b)+mitVal(MIT.m1c,g.m1c)+mitVal(MIT.m2,g.m2);
    const floor=IGRC.rows[0].vals[ci];
    out.reduction=red; out.floor=floor;
    out.grc = igrc!=null ? Math.max(igrc+red,floor) : null;
    out.cumulConflict = (g.m1a==='med' && g.m1b!=='none');
    out.valid = igrc!=null;
  }
  out.arcInitial=computeARC(a);
  out.arcResidual=a.residual||out.arcInitial;
  if(out.grc!=null && out.arcResidual){
    if(out.grc>7) out.sail='CERT';
    else{ const gc=Math.max(2,Math.min(7,out.grc)); const ai={a:0,b:1,c:2,d:3}[out.arcResidual]; out.sail=SAILT[gc][ai]; }
  }
  if(out.sail && out.sail!=='CERT'){
    const si=['I','II','III','IV','V','VI'].indexOf(out.sail);
    out.sailIdx=si; out.osoReq=OSO.map(o=>({id:o.id,cat:o.cat,t:o.t,lvl:o.r[si]}));
  }
  return out;
}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function card(kick,title,desc){

function field(label,obj,key,opts){
  opts=opts||{};
  const f=el('div','field'+(opts.full?' full':''));
  f.appendChild(el('label',null,label));
  let inp;
  if(opts.type==='textarea'){inp=document.createElement('textarea');if(opts.rows)inp.rows=opts.rows;}
  else if(opts.type==='select'){
    inp=document.createElement('select');
    (opts.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];inp.appendChild(op);});
  }
  else {inp=document.createElement('input'); if(opts.inputType)inp.type=opts.inputType;}
  inp.value=obj[key]!=null?obj[key]:'';
  if(opts.readonly)inp.readOnly=true;
  inp.onchange=inp.oninput=()=>{obj[key]=inp.value;scheduleSave();if(opts.after)opts.after();};
  f.appendChild(inp);
  return f;
}

function nextStepFor(r){return {open:'confopen',sts:'confsts',pdra:'confpdra',sora:'grc'}[r]||'mission';}
function dossierSteps(D){
  const s=[['mission','Mission & appareil'],['regime','Régime']];
  if(D.regime==='open') s.push(['confopen','Conformité ouverte']);
  else if(D.regime==='sts') s.push(['confsts','Conformité STS']);

function viewDossier(v){
  const D=curDossier();

  v.appendChild(bar);

  else if(soraStep==='regime') dosRegime(v,D);

  else if(soraStep==='confsts') dosConfSTS(v,D);
  else if(soraStep==='confpdra') dosConfPDRA(v,D);
  else if(soraStep==='grc'){ v.appendChild(summaryBar(R)); soraGRC(v,D,R); }
  else if(soraStep==='arc'){ v.appendChild(summaryBar(R)); soraARC(v,D,R); }
  else if(soraStep==='sail'){ v.appendChild(summaryBar(R)); soraSAIL(v,D,R); }
  else if(soraStep==='prevol') dosPrevol(v,D);
  else if(soraStep==='journal') dosJournal(v,D);
  else dosDocs(v,D,R);
}

function applyModel(D){

/* ---------- Régime : recommandation ---------- */
function recommendRegime(D){
  const c=D.classeC, bvlos=(D.typeVol==='BVLOS'), h=parseFloat(D.hauteurMax)||0, env=D.environnement, dist=D.distanceTiers;
  const m=parseFloat(D.appareil.masse)||0;
  const openClass=['C0','C1','C2','C3','C4'].includes(c);
  const heightOk=(!h||h<=120);
  let missing='';
  if(!c) missing='Renseignez la classe C du drone (onglet Mission & appareil) pour fiabiliser la recommandation.';
  else if(!D.typeVol) missing='Renseignez le type de vol (VLOS / BVLOS) dans l\'onglet Mission.';
  else if(!env) missing='Renseignez l\'environnement survolé dans l\'onglet Mission.';
  if(!bvlos && heightOk && openClass && env!=='rassemblement' && m<25000){
    let sub, why;
    if(c==='C0'||c==='C1'){ sub='A1'; why='Drone '+c+', vol en vue et ≤ 120 m : la sous-catégorie A1 convient (pas de survol intentionnel de tiers, jamais de rassemblement).'; }
    else if(c==='C2' && (dist==='30m'||dist==='5m')){ sub='A2'; why='Drone C2 avec distance de sécurité aux tiers (30 m, ou 5 m en basse vitesse) : sous-catégorie A2 (examen A2 requis).'; }
    else { sub='A3'; why='Drone '+c+' tenu à distance des zones habitées (≥ 150 m) et sans tiers : sous-catégorie A3.'; }
    return {regime:'open', sub, why, missing};
  }
  if(!bvlos && c==='C5' && heightOk) return {regime:'sts', sub:'STS-01', why:'Vol en vue au-dessus d\'une zone au sol contrôlée (même peuplée), drone C5, ≤ 120 m : scénario standard STS-01 (déclaration).', missing};
  if(bvlos && c==='C6') return {regime:'sts', sub:'STS-02', why:'Vol hors vue avec observateurs en zone peu peuplée, drone C6 : scénario standard STS-02 (déclaration).', missing};
  if(bvlos) return {regime:'pdra', why:'Vol hors vue sans drone C6 : vérifiez si un PDRA (hors vue en zone peu peuplée, inspection à faible hauteur…) couvre le concept ; sinon SORA.', missing};
  return {regime:'sora', why:'Opération hors scénario standard et hors PDRA courant : analyse SORA requise (autorisation d\'exploitation).', missing};
}
function dosRegime(v,D){
  const rec=recommendRegime(D);
  const c=card('Régime d\'exploitation','Quel cadre pour cette mission ?','L\'assistant propose le régime le plus adapté d\'après les infos de base. Vous gardez le choix final.');
  const box=el('div','result');
  const left=el('div'); left.innerHTML='<div class="big">'+regimeShort(rec.regime)+'</div><div class="lbl">Recommandé</div>';
  const right=el('div'); right.style.cssText='border-left:1px solid #cfe0f6;padding-left:14px;flex:1';
  right.innerHTML='<b>'+regimeLabel(rec.regime)+(rec.sub?' — '+rec.sub:'')+'</b><div style="color:var(--gris);font-size:13px;margin-top:4px">'+rec.why+'</div>';
  box.append(left,right); c.appendChild(box);

  c.appendChild(el('div','fieldlabel','Régime retenu'));
  const choices=[['open','Catégorie ouverte'],['sts','Spécifique — STS'],['pdra','Spécifique — PDRA'],['sora','Spécifique — SORA']];
  const chips=el('div','chips');

    chips.appendChild(chip);
  });
  c.appendChild(chips);

/* ---------- Conformité catégorie ouverte ---------- */
const OPEN_RULES={
  A1:'A1 — drones C0 (< 250 g) ou C1 (< 900 g). C0 : survol de personnes isolées toléré. C1 : pas de survol intentionnel de tiers. Jamais au-dessus de rassemblements. ≤ 120 m, VLOS.',
  A2:'A2 — drone C2 (< 4 kg). Distance horizontale ≥ 30 m des tiers (5 m en mode basse vitesse). Examen théorique A2 requis. ≤ 120 m, VLOS.',
  A3:'A3 — drones C2, C3 ou C4 (< 25 kg). ≥ 150 m des zones résidentielles, commerciales, industrielles ou récréatives, aucun tiers dans la zone. ≤ 120 m, VLOS.'
};
function openConformite(D){
  const c=D.classeC, sub=D.sousCategorie, h=parseFloat(D.hauteurMax)||0, env=D.environnement, dist=D.distanceTiers, m=parseFloat(D.appareil.masse)||0;
  const issues=[];
  if(D.typeVol==='BVLOS') issues.push('La catégorie ouverte impose le vol en vue directe (VLOS).');
  if(h>120) issues.push('Hauteur > 120 m : hors catégorie ouverte (dérogation préfectorale, sinon spécifique).');
  if(env==='rassemblement') issues.push('Survol de rassemblement de personnes : interdit en catégorie ouverte.');
  if(m>=25000) issues.push('Masse ≥ 25 kg : hors catégorie ouverte.');
  if(sub==='A1'){
    if(!['C0','C1'].includes(c)) issues.push('A1 exige un drone C0 ou C1 (actuel : '+(c||'non renseigné')+').');
    if(c==='C1' && dist==='survol') issues.push('A1 / C1 : pas de survol intentionnel de tiers.');
  } else if(sub==='A2'){
    if(c!=='C2') issues.push('A2 exige un drone C2 (actuel : '+(c||'non renseigné')+').');
    if(!(dist==='30m'||dist==='5m'||dist==='150m'||dist==='exclus')) issues.push('A2 : tenir ≥ 30 m des tiers (5 m en basse vitesse).');
  } else if(sub==='A3'){
    if(!['C2','C3','C4'].includes(c)) issues.push('A3 admet C2, C3 ou C4 (actuel : '+(c||'non renseigné')+').');
    if(!(dist==='150m'||dist==='exclus')) issues.push('A3 : ≥ 150 m des zones habitées et aucun tiers dans la zone.');
  } else {
    issues.push('Choisissez la sous-catégorie A1, A2 ou A3.');
  }
  return issues;
}
function dosConfOpen(v,D){
  const c=card('Catégorie ouverte','Conformité de l\'exploitation','Vérifie que la sous-catégorie A1/A2/A3 est cohérente avec le drone et les conditions de vol.');

  const form=doc.getForm();
  let n=0;
  for(const k in mapping){ try{ form.getTextField(k).setText(String(mapping[k]||'')); n++; }catch(e){} }
  if(checkFn) checkFn(form);
  const bytes=await doc.save();
  const path=await invoke('export_file',{subdir:subdir,filename:filename,dataB64:b64FromBytes(bytes)});
  openPath(path);
  return {n,path};
}
async function genCerfa(D){
  try{
    const r=await fillAndExport('cerfa', cerfaMapping(D), (form)=>{
      const chk=CERFA_CHK[(D.forms||{}).regime]; if(chk){ try{ form.getCheckBox(chk).check(); }catch(e){} }
    }, D.titre||'Mission', 'Cerfa_15476-04_rempli.pdf');
    if(r) setSaved('✓ Cerfa généré ('+r.n+' champs)');
  }catch(e){ alert('Génération impossible : '+e); }
}
async function genDerog(D){
  try{
    const r=await fillAndExport('derog', derogMapping(D), (form)=>{
      const chk=n=>{ try{ form.getCheckBox(n).check(); }catch(e){} };
      const typeMap={A:'1',B:'2',C:'3',D:'4',E:'5'};
      const t=(D.forms||{}).derogType; if(typeMap[t]) chk('Case #C3#A0 cocher '+typeMap[t]);
      chk(D.typeVol==='BVLOS'?'Case #C3#A0 cocher 9':'Case #C3#A0 cocher 8');
      ['Case #C3#A0 cocher 10','Case #C3#A0 cocher 11','Case #C3#A0 cocher 12'].forEach(chk);
    }, D.titre||'Mission', 'Demande_derogation_R5-UAS-DEROG.pdf');
    if(r) setSaved('✓ Dérogation générée');
  }catch(e){ alert('Génération impossible : '+e); }
}
async function genAOT(D){
  try{
    const path=await invoke('export_file',{subdir:D.titre||'Mission',filename:'Demande_AOT.html',dataB64:b64FromBytes(new TextEncoder().encode(aotHTML(D)))});
    openPath(path); setSaved('✓ Lettre AOT générée');
  }catch(e){ alert('Génération impossible : '+e); }
}

/* ========== DÉMARRAGE / VERROU ========== */
const lock=document.getElementById('lock'), appEl=document.getElementById('app');
const lockTitle=document.getElementById('lockTitle'), lockText=document.getElementById('lockText');
const pin=document.getElementById('pin'), pin2=document.getElementById('pin2');
const btnPin=document.getElementById('btnPin'), pinMsg=document.getElementById('pinMsg');
let pinMode='enter';
function setPinMsg(t,cls){pinMsg.textContent=t;pinMsg.className='msg '+(cls||'');}
async function bootLock(){
  const has=await invoke('pin_status');
  pinMode=has?'enter':'create';
  if(pinMode==='create'){
    lockTitle.textContent='Créer un code PIN';
    lockText.textContent='Choisissez un code (au moins 4 chiffres) pour protéger l\'accès à ce poste.';
    pin.placeholder='Nouveau code';pin2.style.display='block';
  }else{
    lockTitle.textContent='Assistant Vol Drone';
    lockText.textContent='Entrez votre code PIN.';
    pin2.style.display='none';
  }
  pin.value='';pin2.value='';pin.focus();
}
async function submitPin(){
  const code=pin.value.trim();
  if(pinMode==='create'){
    if(code.length<4){setPinMsg('Au moins 4 chiffres.','err');return;}
    if(code!==pin2.value.trim()){setPinMsg('Les deux codes ne correspondent pas.','err');return;}
    try{await invoke('set_pin',{pin:code});setPinMsg('',''); enterApp();}
    catch(e){setPinMsg(String(e),'err');}
  }else{
    const okv=await invoke('verify_pin',{pin:code});
    if(okv){setPinMsg('','');enterApp();}
    else{setPinMsg('Code incorrect.','err');pin.value='';pin.focus();}
  }
}
async function enterApp(){
  lock.style.display='none';appEl.classList.add('show');
  await loadStore();
  renderNav();renderView();setSaved('');
}
btnPin.addEventListener('click',submitPin);
pin.addEventListener('keydown',e=>{if(e.key==='Enter'){pinMode==='create'?pin2.focus():submitPin();}});
pin2.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin();});
document.getElementById('btnLock').addEventListener('click',()=>{appEl.classList.remove('show');lock.style.display='flex';bootLock();});
bootLock();
</script>
